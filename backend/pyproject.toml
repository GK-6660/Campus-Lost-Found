[project]
name = "campus-lost-found"
version = "0.1.0"
description = "Campus lost-and-found API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.2",
    "pydantic>=2",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2",
    "uvicorn>=0.32",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
